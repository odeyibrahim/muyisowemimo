<style>*{box-sizing:border-box;margin:0;padding:0}:root{--red:#7a1020;--deep:#4a0a14;--cream:#FBF8F3;--tint:#F5EFE6;--line:#D9D2C5;--ink:#2d2a2a;--soft:#6b6666}

.btn{background:var(--red);color:#fff;border:1px solid var(--red);padding:10px 18px;cursor:pointer;font-weight:600}.btn:hover{background:var(--deep)}.btn.sec{background:transparent;color:var(--red)}.btn.sec:hover{background:var(--red);color:#fff}.btn.sm{padding:5px 10px;font-size:12px}.btn.danger{background:#fff;color:#a11;border-color:#a11}.btn:disabled{opacity:.5}

function clean(v, t) {
  if (t === 'text') return clip(v, 400);

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>')
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, h) => { const u = safeHref(h.replace(/&amp;/g, '&')); return u ? `<a href="${esc(u)}">${t}</a>` : t; });
// Small, safe rich text: blank line = paragraph, "## " = sub-heading, "- " = bullet, **bold**, *italic*, [text](link)
function rt(src) {
  const out = []; let list = [], para = [];
  const fl = () => { if (list.length) out.push(`<ul>${list.map((x) => `<li>${inline(x)}</li>`).join('')}</ul>`); list = []; };
  const fp = () => { if (para.length) out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; };
  for (const raw of String(src || '').split('\n')) {
    const l = raw.trim();
    if (!l) { fl(); fp(); } else if (l.startsWith('## ')) { fl(); fp(); out.push(`<h3>${inline(l.slice(3))}</h3>`); }
    else if (/^[-·•] /.test(l)) { fp(); list.push(l.slice(2)); } else { fl(); para.push(l); }
  }
  fl(); fp(); return out.join('\n');
}
